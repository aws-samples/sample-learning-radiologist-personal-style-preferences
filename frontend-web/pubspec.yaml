name: report_preferences_web
description: Flutter web frontend for radiology report style preferences learning
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.0

  # Auth
  amplify_flutter: ^2.5.0
  amplify_auth_cognito: ^2.5.0

  # HTTP & JSON
  dio: ^5.4.3+1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.70.2

  # Utils
  uuid: ^4.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
