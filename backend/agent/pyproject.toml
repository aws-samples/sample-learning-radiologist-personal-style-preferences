requires-python = ">=3.11"
dependencies = [
    "strands-agents",
    "bedrock-agentcore",
    "boto3>=1.35.0",
    "numpy>=1.26.0",
    "bedrock-agentcore-starter-toolkit>=0.2.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
